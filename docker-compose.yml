version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opd
      POSTGRES_USER: opd_owner
      POSTGRES_PASSWORD: opd_owner
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo --reset &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=opd
      - DB_USER=opd_app
      - DB_PASSWORD=opd_app
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=1
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A config worker -l info --pool=solo
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - DB_NAME=opd
      - DB_USER=opd_owner   # Worker runs migrations or needs bypass sometimes, owner is safer for raw tasks
      - DB_PASSWORD=opd_owner
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
