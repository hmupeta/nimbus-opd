databases:
  - name: nimbus-db
    databaseName: nimbus
    user: nimbus_admin
    plan: free

services:
  # 1. Redis for Celery
  - type: redis
    name: nimbus-redis
    plan: free
    ipAllowList: []

  # 2. Django Backend
  - type: web
    name: nimbus-backend
    env: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nimbus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nimbus-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.13.0"

  # 3. React Frontend (Corrected: type web + runtime static)
  - type: web
    name: nimbus-frontend
    runtime: static
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE
        value: "https://nimbus-backend.onrender.com"