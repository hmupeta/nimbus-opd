databases:
  - name: nimbus-db
    databaseName: nimbus
    user: nimbus_admin
    plan: free

services:
  # 1. Redis for Celery
  - type: redis
    name: nimbus-redis
    plan: free
    ipAllowList: []

  # 2. Django Backend
  - type: web
    name: nimbus-backend
    env: python
    plan: free
    buildCommand: "bash build.sh"
    # Explicitly bind to the port Render provides
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    # Run migrations in a separate, dedicated step before the app starts
    preDeployCommand: "python manage.py migrate --noinput"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nimbus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nimbus-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.13.0"

  # 3. React Frontend
  - type: web
    name: nimbus-frontend
    runtime: static
    plan: free
    buildCommand: "npm install && npm run build"
    # The path is relative to the rootDir (frontend)
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE
        value: "https://nimbus-backend.onrender.com" # Update after backend is live